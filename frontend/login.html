<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Configuración básica del documento -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título mostrado en la pestaña del navegador -->
  <title>JobConnect | Inicio de sesión</title>

  <!-- Bootstrap 5 para diseño responsive y componentes visuales -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <!-- Hoja de estilos propia del proyecto -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">JobConnect</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLogin"
        aria-controls="navbarLogin" aria-expanded="false" aria-label="Mostrar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarLogin">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="ofertas-demandas.html">Ofertas/Demandas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="usuarios.html">Usuarios</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 session-actions">
          <a class="nav-link session-login-link active" aria-current="page" href="login.html">Login</a>

          <span class="navbar-text usuario-sesion-navbar d-none" id="usuarioActivo"></span>

          <button id="btn-cerrar-sesion" class="btn btn-sm btn-outline-light session-button-hidden" type="button">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>

<main class="container py-4 d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 150px);">
    <section class="seccion-formulario login-panel" style="width: min(100%, 520px);">
      <div class="section-heading-block">
        <h1 class="section-title">Inicio de sesión</h1>
      </div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="email-login" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email-login"
            placeholder="usuario@correo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password-login" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password-login"
            placeholder="Introduce tu contraseña"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
      </form>

      <div id="mensaje-login" class="mt-3"></div>
    </section>
  </main>

  <footer>
    <div class="container text-center">
      FULL STACK ATTACK · JobConnect · Producto 4
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script type="module" src="assets/js/int_2_login.js"></script>
</body>

</html>
